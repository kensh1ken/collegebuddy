<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CollegeBuddy - Sign Up</title>

    <link rel="stylesheet" href="./auth.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>CollegeBuddy</h1>
        <p class="subtitle">Create your account</p>

        <form id="signupForm">

            <input
                type="text"
                id="signupName"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                id="signupEmail"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="signupPassword"
                placeholder="Password"
                minlength="8"
                required
            >

            <button type="submit">
                Create Account
            </button>

        </form>

        <p id="message"></p>

        <p class="switch">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

</div>

<script src="./js/api-client.js"></script>
<script src="./auth.js"></script>

</body>
</html>

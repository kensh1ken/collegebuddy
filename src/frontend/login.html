<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CollegeBuddy - Login</title>
    <link rel="stylesheet" href="./auth.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>CollegeBuddy</h1>
        <p class="subtitle">Welcome back!</p>

        <form id="loginForm">

            <input
                type="email"
                id="loginEmail"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

        <p class="switch">
            Don't have an account?
            <a href="signup.html">Sign up</a>
        </p>

    </div>

</div>

<script src="./js/api-client.js"></script>
<script src="./auth.js"></script>

</body>
</html>
